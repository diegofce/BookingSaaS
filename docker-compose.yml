services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/app/scripts/start-api.sh"]
    environment:
      DATABASE_URL: postgresql+psycopg2://booking:booking@db:5432/booking
      JWT_SECRET_KEY: change-me-in-production
      JWT_ALGORITHM: HS256
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      ENABLE_BACKGROUND_REMINDERS: "true"
      BOOTSTRAP_REMINDERS_ON_STARTUP: "true"
      REMINDER_MINUTES_BEFORE: "60"
      REMINDER_PROCESSING_TIMEOUT_MINUTES: "15"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/app/scripts/start-worker.sh"]
    environment:
      DATABASE_URL: postgresql+psycopg2://booking:booking@db:5432/booking
      JWT_SECRET_KEY: change-me-in-production
      JWT_ALGORITHM: HS256
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      ENABLE_BACKGROUND_REMINDERS: "true"
      BOOTSTRAP_REMINDERS_ON_STARTUP: "false"
      REMINDER_MINUTES_BEFORE: "60"
      REMINDER_PROCESSING_TIMEOUT_MINUTES: "15"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
